      <text x="148" y="64" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="24" font-weight="700" fill="#7ba520" dominant-baseline="hanging"><tspan x="148" dy="0">副交感</tspan></text>
