    <text x="198" y="826" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#7ba520" dominant-baseline="hanging"><tspan x="198" dy="0">副交感神經（煞車）</tspan></text>
    <text x="198" y="884" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="28" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="198" dy="0">讓身體進入「休息與修復」狀態，使心跳</tspan><tspan x="198" dy="36.4">減慢、放鬆身心、促進恢復。</tspan></text>
    
