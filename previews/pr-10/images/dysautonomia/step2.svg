    <text x="198" y="378" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#1180cf" dominant-baseline="hanging"><tspan x="198" dy="0">自律神經是什麼？</tspan></text>
    <text x="198" y="436" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="28" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="198" dy="0">自律神經負責調節心跳、呼吸、消化、體</tspan><tspan x="198" dy="36.4">溫等，維持身體機能平衡。</tspan></text>
    
  
    
    <rect x="70" y="562" width="1060" height="190" rx="28" fill="#eef6ff" stroke="rgba(78, 123, 189, 0.18)" stroke-width="2"/>
    
    <g>
