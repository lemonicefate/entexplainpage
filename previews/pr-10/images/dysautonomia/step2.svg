    <text x="198" y="602" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#1180cf" dominant-baseline="hanging"><tspan x="198" dy="0">交感神經（油門）</tspan></text>
    <text x="198" y="660" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="28" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="198" dy="0">讓身體進入「戰鬥或逃跑」狀態，使心跳</tspan><tspan x="198" dy="36.4">加快、血壓上升、精神集中。</tspan></text>
    
    <g>
