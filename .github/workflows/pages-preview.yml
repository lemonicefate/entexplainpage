name: Pages Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_BRANCH: gh-pages

jobs:
  deploy:
    name: Deploy Pages / Preview
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          workdir="/tmp/gh-pages"

          rm -rf "$workdir"
          if git ls-remote --heads "$remote_url" "${PAGES_BRANCH}" | grep -q "refs/heads/${PAGES_BRANCH}"; then
            git clone --depth 1 --branch "${PAGES_BRANCH}" "$remote_url" "$workdir"
          else
            git init "$workdir"
            cd "$workdir"
            git checkout -b "${PAGES_BRANCH}"
            git remote add origin "$remote_url"
            touch .nojekyll
            git add .nojekyll
            git commit -m "chore: init gh-pages" >/dev/null
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            rsync -a --delete \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'node_modules' \
              --exclude 'playwright-report' \
              --exclude 'test-results' \
              --exclude 'previews' \
              --exclude '.DS_Store' \
              ./ "$workdir"/
            preview_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPOSITORY#*/}/"
          else
            preview_path="previews/pr-${PR_NUMBER}"
            mkdir -p "$workdir/$preview_path"
            rsync -a --delete \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'node_modules' \
              --exclude 'playwright-report' \
              --exclude 'test-results' \
              --exclude '.DS_Store' \
              ./ "$workdir/$preview_path"/
            preview_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPOSITORY#*/}/${preview_path}/"
          fi

          cd "$workdir"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add -A
          if ! git diff --cached --quiet; then
            if [ "$EVENT_NAME" = "push" ]; then
              git commit -m "docs: publish site"
            else
              git commit -m "docs: publish preview for PR #${PR_NUMBER}"
            fi
            git push origin "${PAGES_BRANCH}"
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$preview_url" > /tmp/preview-url.txt
          fi

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL_FILE: /tmp/preview-url.txt
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pages-preview -->';
            const previewUrl = fs.readFileSync(process.env.PREVIEW_URL_FILE, 'utf8').trim();
            const body = `${marker}\nPreview URL: ${previewUrl}\n\nUpdated automatically on each push to this PR.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((c) => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  cleanup:
    name: Remove Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview directory from gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          remote_url="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          workdir="/tmp/gh-pages"
          preview_path="previews/pr-${PR_NUMBER}"

          if ! git ls-remote --heads "$remote_url" "${PAGES_BRANCH}" | grep -q "refs/heads/${PAGES_BRANCH}"; then
            exit 0
          fi

          git clone --depth 1 --branch "${PAGES_BRANCH}" "$remote_url" "$workdir"
          cd "$workdir"
          rm -rf "$preview_path"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: remove preview for PR #${PR_NUMBER}"
            git push origin "${PAGES_BRANCH}"
          fi

      - name: Update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const body = `${marker}\nPreview removed because this pull request was closed.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const existing = comments.find((c) => c.user && c.user.type === 'Bot' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
