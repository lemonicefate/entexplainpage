    </g>
    <text x="198" y="942" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#1180cf" dominant-baseline="hanging"><tspan x="198" dy="0">約 5～10 分鐘完成</tspan></text>
    <text x="198" y="1000" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="28" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="198" dy="0">檢測快速簡便，過程放鬆，輕鬆掌握自律</tspan><tspan x="198" dy="36.4">神經健康狀態。</tspan></text>
    
  
