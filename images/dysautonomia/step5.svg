    </g>
    <text x="198" y="550" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#1180cf" dominant-baseline="hanging"><tspan x="198" dy="0">非侵入性</tspan></text>
    <text x="198" y="608" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="28" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="198" dy="0">透過感測器接觸皮膚進行檢測，安全舒適</tspan><tspan x="198" dy="36.4">、無痛無創。</tspan></text>
    
  
    
