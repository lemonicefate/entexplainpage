    <text x="198" y="354" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#1180cf" dominant-baseline="hanging"><tspan x="198" dy="0">心率變異度檢測</tspan></text>
    <text x="198" y="412" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="28" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="198" dy="0">透過分析心跳間隔變化，評估交感與副交</tspan><tspan x="198" dy="36.4">感神經平衡。</tspan></text>
    
  
    
