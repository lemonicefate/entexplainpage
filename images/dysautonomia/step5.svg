    </g>
    <text x="198" y="746" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#1180cf" dominant-baseline="hanging"><tspan x="198" dy="0">不需抽血</tspan></text>
    <text x="198" y="804" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="28" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="198" dy="0">無需採血，不造成身體負擔，適合各年齡</tspan><tspan x="198" dy="36.4">層定期檢測。</tspan></text>
    
  
    
