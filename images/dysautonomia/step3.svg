    <rect x="70" y="330" width="694" height="206" rx="28" fill="#edf5ff" stroke="rgba(78, 123, 189, 0.18)" stroke-width="2"/>
    
    <g>
      <circle cx="115" cy="402" r="34" fill="#1180cf"/>
      <text x="115" y="386.04" text-anchor="middle" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="38" font-weight="800" fill="#fff" dominant-baseline="hanging"><tspan x="115" dy="0">1</tspan></text>
    </g>
    <text x="170" y="358" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#184f85" dominant-baseline="hanging"><tspan x="170" dy="0">壓力累積</tspan></text>
    <text x="170" y="424" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="26" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="170" dy="0">長期壓力、工作負荷過大，</tspan><tspan x="170" dy="35.879999999999995">使身心持續緊繃，</tspan><tspan x="170" dy="35.879999999999995">壓力越積越多。</tspan></text>
    <rect x="70" y="566" width="694" height="206" rx="28" fill="#eef6ff" stroke="rgba(78, 123, 189, 0.18)" stroke-width="2"/>
    
    <g>
      <circle cx="115" cy="638" r="34" fill="#1180cf"/>
      <text x="115" y="622.04" text-anchor="middle" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="38" font-weight="800" fill="#fff" dominant-baseline="hanging"><tspan x="115" dy="0">2</tspan></text>
    </g>
    <text x="170" y="594" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#184f85" dominant-baseline="hanging"><tspan x="170" dy="0">生活作息不良</tspan></text>
    <text x="170" y="660" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="26" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="170" dy="0">熬夜與睡眠不足、</tspan><tspan x="170" dy="35.879999999999995">作息不規律，</tspan><tspan x="170" dy="35.879999999999995">打亂生理時鐘。</tspan></text>
    <rect x="70" y="802" width="694" height="206" rx="28" fill="#f4f8e9" stroke="rgba(78, 123, 189, 0.18)" stroke-width="2"/>
    
    <g>
      <circle cx="115" cy="874" r="34" fill="#78a91d"/>
      <text x="115" y="858.04" text-anchor="middle" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="38" font-weight="800" fill="#fff" dominant-baseline="hanging"><tspan x="115" dy="0">3</tspan></text>
    </g>
    <text x="170" y="830" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="40" font-weight="800" fill="#4d8f12" dominant-baseline="hanging"><tspan x="170" dy="0">不良生活習慣</tspan></text>
    <text x="170" y="896" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="26" font-weight="600" fill="#22334f" dominant-baseline="hanging"><tspan x="170" dy="0">飲食失衡、缺乏運動，</tspan><tspan x="170" dy="35.879999999999995">影響身體機能平衡，</tspan><tspan x="170" dy="35.879999999999995">增加失調風險。</tspan></text>
