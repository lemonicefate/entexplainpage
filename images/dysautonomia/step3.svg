    <text x="82" y="80" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="82" font-weight="900" fill="#184f85" dominant-baseline="hanging"><tspan x="82" dy="0">為什麼會發生？</tspan></text>
    <g transform="translate(948 110) rotate(-12)">
      <path d="M 0 0 C 18 -34, 32 -56, 62 -54 C 48 -16, 26 26, -4 44 C -12 26, -8 10, 0 0 Z" fill="#ef8a1f"/>
