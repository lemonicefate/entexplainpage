    <text x="800" y="924" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="24" font-weight="700" fill="#1f2e4d" dominant-baseline="hanging"><tspan x="800" dy="0">當壓力超過身體負荷，就可能引起自律神經失調。</tspan></text>
    
