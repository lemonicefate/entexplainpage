      <text x="92" y="272" text-anchor="start" font-family="Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif" font-size="24" font-weight="700" fill="#a0aab8" dominant-baseline="hanging"><tspan x="92" dy="0">壓力累積 / 作息 / 習慣</tspan></text>
    </g>
    <g transform="translate(790 618)">
      <rect x="0" y="0" width="318" height="266" rx="34" fill="#f7fbff" stroke="#d7e7f7" stroke-width="3"/>
      <rect x="96" y="36" width="126" height="168" rx="12" fill="#f3efe8" stroke="#c8d7ea" stroke-width="3"/>
